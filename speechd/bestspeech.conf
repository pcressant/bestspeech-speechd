# Module BestSpeech (Keynote Gold) pour Speech Dispatcher.
#
# Speech Dispatcher envoie langue, voix, debit, hauteur, etendue, volume,
# ponctuation, epellation et majuscules a chaque message : rien d'autre
# n'est obligatoire ici.
#
# Ne pas ajouter de ligne AddModule dans speechd.conf : la premiere
# declaration explicite coupe la decouverte automatique de tous les autres
# modules.

# Version du moteur prise quand seule la langue est demandee.
# Francais : 2006FRE (defaut) ou 1998FRN.
# Anglais : 1995 (defaut, le son classique du Keynote Gold), 1998ENG ou 2006ENG.
DefaultBuild fr 2006FRE
DefaultBuild en 1995

# Vitesse atteinte au debit 100, en multiple de la vitesse normale (1 a 8).
# Au-dela d'environ 2,5 fois, Sonic accelere ce que le moteur ne peut pas.
MaxSpeed 4

# Journal de debogage sur la sortie d'erreur du module.
Debug 0
